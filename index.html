<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complex Sentences Lab · A2</title><style>
:root{font-family:system-ui,"Noto Sans Thai",sans-serif;color:#20334a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f6ae4b;outline-offset:3px}.shell{max-width:930px;margin:auto;padding:28px 18px 48px}.hero{background:linear-gradient(120deg,#142d51,#245c82);color:white;padding:30px;border-radius:24px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;color:#c3e8f6}.hero h1{font-size:clamp(26px,5vw,40px);margin:8px 0}.hero p{color:#e1eefa;margin:8px 0}.progressrow{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:13px}.meter{background:#55738e;height:9px;border-radius:30px;overflow:hidden;margin-top:8px}.fill{background:#6fe0b1;height:100%;transition:width .25s}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;margin-top:20px}.navbox,.panel{background:white;border:1px solid #dfe7f0;border-radius:20px;box-shadow:0 8px 26px #1b37500a}.navbox{padding:16px;align-self:start}.navtitle{font-size:12px;font-weight:750;color:#60738b;text-transform:uppercase;margin:3px 0 14px}.tabs{display:grid;gap:7px}.tab{width:100%;border:0;background:transparent;text-align:left;padding:13px 11px;border-radius:12px;color:#4c6075;display:flex;gap:10px;align-items:center}.tab.active{background:#e8f2ff;color:#12569c;font-weight:750}.tab:disabled{opacity:.48;cursor:not-allowed}.tab .num{display:inline-grid;place-items:center;border:1px solid #c9d8e7;border-radius:50%;width:27px;height:27px;flex:none;font-size:12px}.tab.done .num{background:#dff5e8;color:#13784b;border-color:#bde7ce}.panel{padding:30px;min-height:450px}.stepmeta{font-size:12px;color:#657c93;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.panel h2{font-size:clamp(21px,3vw,27px);margin:8px 0}.intro{color:#526981;line-height:1.7}.question,.example{padding:18px;border-radius:14px;background:#f2f6fb;margin:18px 0}.question h3{margin:8px 0;font-size:18px}.main{color:#137b4d;font-weight:750}.conj{color:#bb3e45;font-weight:750}.dep{color:#2367b2;font-weight:750}.legend{font-size:13px;color:#526981;line-height:1.8}.bank{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.word{padding:10px;border:1px solid #dbe5ef;border-radius:10px;font-size:14px}.word b{color:#b93b44}.choices{display:grid;gap:10px;margin:18px 0}.choice{background:white;border:1.5px solid #cbd9e7;border-radius:13px;padding:15px;text-align:left;color:#243c56;line-height:1.5;display:flex;align-items:center;gap:12px}.choice:before{content:"";width:18px;height:18px;border:2px solid #aabed1;border-radius:50%;flex:none}.choice.selected{border-color:#236db8;background:#eaf4ff}.choice.selected:before{border:6px solid #236db8}.feedback{border-radius:12px;padding:14px 16px;background:#fff5e4;color:#79501c;line-height:1.65}.feedback.good{background:#e7f7ed;color:#16623d}.support{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.support p{width:100%}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}.primary,.secondary{border-radius:12px;padding:12px 19px;border:1px solid #256bb1}.primary{background:#2068b4;color:white;font-weight:700}.primary:disabled{opacity:.4;cursor:not-allowed}.secondary{background:white;color:#205d9b}.muted{font-size:13px;color:#667b90}.small{font-size:13px}.note{margin-top:20px;color:#718298;font-size:12px;line-height:1.6}.finish{background:#edf9f2;border:1px solid #b9e6c9;border-radius:14px;padding:17px}.finish h3{margin:0 0 8px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{background:#eef3f9;padding:7px 10px;border-radius:20px;font-size:12px;color:#38516a}@media(max-width:720px){.shell{padding:10px 10px 32px}.hero{padding:22px;border-radius:18px}.layout{display:block;margin-top:12px}.navbox{padding:9px;margin-bottom:12px}.navtitle{display:none}.tabs{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.tab{padding:8px 2px;display:grid;justify-items:center;gap:4px;text-align:center;font-size:10px}.tab .num{width:24px;height:24px}.panel{padding:20px;min-height:400px}.bank{grid-template-columns:repeat(2,minmax(0,1fr))}.footer{align-items:stretch}.footer button{flex:1}}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">ENGLISH LAB · A2 · GUIDED PRACTICE</div><h1>Build a Complex Sentence</h1><p>ฝึกทีละขั้น เริ่มจากคำเชื่อม ไปจนถึงการเลือกประโยคที่ถูกต้อง</p><div class="progressrow"><span id="current">Step 1 of 5</span><span id="progress">สำเร็จ 0/5 ขั้น</span></div><div class="meter" role="progressbar" aria-label="ความก้าวหน้า" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" id="progressbar"><div id="fill" class="fill"></div></div></header><div class="layout"><aside class="navbox"><div class="navtitle">Learning path</div><nav id="tabs" class="tabs" aria-label="ลำดับการเรียน"></nav></aside><section id="panel" class="panel" aria-live="polite"></section></div><p class="note">สื่อทำงานในเบราว์เซอร์ ไม่ต้องเข้าสู่ระบบหรือเชื่อมฐานข้อมูล • การรีเฟรชจะเริ่มบทเรียนใหม่</p></main><script>
const words=[['because','เพราะว่า'],['although','แม้ว่า'],['when','เมื่อ / ตอนที่'],['if','ถ้า'],['before','ก่อนที่'],['after','หลังจากที่']];
const identify=[{s:'I stayed home because I was sick.',o:['I stayed home','because I was sick'],a:0,why:'I stayed home เป็นประโยคหลัก ส่วน because I was sick เป็น dependent clause ที่ขึ้นต้นด้วยคำเชื่อม'},{s:'When the bell rang, we went outside.',o:['When the bell rang','we went outside'],a:1,why:'we went outside อยู่เดี่ยว ๆ ได้ ส่วน When the bell rang ต้องอาศัยประโยคหลัก'},{s:'She was happy although she was tired.',o:['She was happy','although she was tired'],a:0,why:'She was happy เป็น main clause ส่วน although she was tired เป็น dependent clause'}];
const build=[{s:'I was tired. I finished my homework.',o:['Although I was tired, I finished my homework.','Because I was tired, I finished my homework.','Although I was tired I finished my homework.'],a:0,why:'Although แสดงความขัดแย้ง และมี comma หลัง dependent clause ที่อยู่ข้างหน้า'},{s:'You study hard. You will pass.',o:['If you study hard, you will pass.','Although you study hard, you will pass.','If you study hard you will pass.'],a:0,why:'If แสดงเงื่อนไข และต้องมี comma เมื่อ if-clause อยู่ข้างหน้า'},{s:'I brush my teeth. I go to bed.',o:['I brush my teeth before I go to bed.','I brush my teeth although I go to bed.','Before I brush my teeth I go to bed.'],a:0,why:'Before แสดงลำดับเวลา โดยไม่ต้องใส่ comma เมื่อ main clause อยู่ข้างหน้า'}];
const comma=[{s:'Because I was late I missed the bus.',o:['Because I was late, I missed the bus.','Because I was late I missed the bus.'],a:0,why:'dependent clause อยู่หน้า main clause จึงใส่ comma'},{s:'I missed the bus because I was late.',o:['I missed the bus, because I was late.','I missed the bus because I was late.'],a:1,why:'main clause อยู่ก่อน because-clause จึงไม่ต้องใช้ comma ในรูปแบบนี้'},{s:'Although she was sick she went to school.',o:['Although she was sick, she went to school.','Although she was sick she went to school.'],a:0,why:'Although-clause อยู่หน้า main clause ต้องใส่ comma'}];
const finalQuiz=[
{s:'Which sentence correctly explains why you stayed home?',o:['Because it rained, I stayed home.','Because it rained, so I stayed home.','Because it rained.'],a:0,why:'Because-clause อยู่ข้างหน้า ต้องตามด้วย comma และ main clause โดยไม่ใช้ so ซ้ำ'},
{s:'Choose the correct sentence about homework.',o:['Although I was tired, but I finished my homework.','Although I was tired, I finished my homework.','Although I was tired I finished my homework.'],a:1,why:'Although ไม่ใช้ but ซ้ำ และต้องมี comma เมื่อ although-clause อยู่หน้า'},
{s:'Choose the correct sentence about the weekend.',o:['If it rains, I will stay home.','If it rains I will stay home.','If it rains, so I will stay home.'],a:0,why:'If-clause ที่ขึ้นต้นประโยคต้องตามด้วย comma ก่อน main clause'},
{s:'Which sentence is correct?',o:['I will call you after I finish work.','I will call you, after I finish work.','After I finish work I will call you.'],a:0,why:'เมื่อ main clause อยู่ก่อน after-clause ไม่ต้องใช้ comma ในรูปแบบนี้'}
];
const names=['Learn','Identify','Build','Comma','Challenge'];
let vocabPhase='study', vocabHint=false, assisted=0, vocabAssisted=false;
const order=[2,5,1,4,0,3];
let stage=0,idx=[0,0,0,0,0],selected=-1,done=[false,false,false,false,false],finished=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){document.getElementById('tabs').innerHTML=names.map((n,i)=>`<button class="tab ${stage===i?'active':''} ${done[i]?'done':''}" ${i>0&&!done[i-1]?'disabled':''} onclick="go(${i})" ${stage===i?'aria-current="step"':''}><span class="num">${done[i]?'✓':i+1}</span><span>${n}</span></button>`).join('');let n=done.filter(Boolean).length;document.getElementById('fill').style.width=n*20+'%';document.getElementById('progress').textContent=`สำเร็จ ${n}/5 ขั้น`;document.getElementById('current').textContent=finished?'Completed':`Step ${stage+1} of 5`;document.getElementById('progressbar').setAttribute('aria-valuenow',n)}
function go(n){if(n>0&&!done[n-1])return;stage=n;selected=-1;render()}
function choose(i){selected=i;render()}
function startRecall(){vocabPhase='recall';vocabHint=false;selected=-1;render()}
function toggleHint(){vocabHint=!vocabHint;if(vocabHint)vocabAssisted=true;render()}
function restart(){stage=0;idx=[0,0,0,0,0];selected=-1;done=[false,false,false,false,false];finished=false;vocabPhase='study';vocabHint=false;vocabAssisted=false;assisted=0;render()}
function advance(){let q=stage===0?{a:order.indexOf(idx[0])}:(stage===1?identify:stage===2?build:stage===3?comma:finalQuiz)[idx[stage]];if(selected!==q.a)return;if(stage===0&&vocabAssisted)assisted++;idx[stage]++;selected=-1;if(stage===0){vocabHint=false;vocabAssisted=false;}let total=stage===0?words.length:(stage===1?identify:stage===2?build:stage===3?comma:finalQuiz).length;if(idx[stage]===total){done[stage]=true;if(stage<4)stage++;else finished=true;}render()}
function options(arr,answer){return `<div class="choices" role="group" aria-label="เลือกคำตอบ">${arr.map((o,i)=>`<button class="choice ${selected===i?'selected':''}" aria-pressed="${selected===i}" onclick="choose(${i})">${esc(o)}</button>`).join('')}</div>${selected>=0?`<div class="feedback ${selected===answer?'good':''}" role="status">${selected===answer?'✓ ถูกต้อง! '+esc(explain()):'ลองอีกครั้งนะ อ่านความหมายและสังเกตโครงสร้างประโยค'}</div>`:''}`}
function explain(){if(stage===0)return vocabAssisted?'ตอบถูกหลังใช้ตัวช่วย':'ตอบถูกด้วยตนเอง';let arr=stage===1?identify:stage===2?build:stage===3?comma:finalQuiz;return arr[idx[stage]].why}
function render(){nav();let p=document.getElementById('panel');if(finished){p.innerHTML=`<div class="stepmeta">Learning complete</div><h2>เยี่ยมมาก! 🎉</h2><div class="finish"><h3>ผ่านครบทั้ง 5 ขั้นแล้ว</h3><p>คุณฝึกคำเชื่อม การแยกประโยคหลัก การรวมประโยค การใช้ comma และการเลือกประโยคที่ถูกต้องแล้ว</p></div><p class="intro">Step 1: ใช้ตัวช่วย ${assisted} จาก 6 ข้อ</p><div class="summary"><span class="chip">✓ Conjunctions</span><span class="chip">✓ Main clause</span><span class="chip">✓ Sentence building</span><span class="chip">✓ Comma</span></div><p class="intro">จำไว้ว่า <strong>Because it rained, I stayed home.</strong> มี comma เพราะ dependent clause อยู่ข้างหน้า</p><div class="footer"><button class="secondary" onclick="go(4)">ทบทวน Step 5</button><button class="primary" onclick="restart()">เริ่มฝึกใหม่ ↻</button></div>`;return}
let html=`<div class="stepmeta">Step ${stage+1} / 5 · ${stage===0?'Vocabulary':stage===1?'Recognize':stage===2?'Combine':stage===3?'Punctuation':'Mastery check'}</div>`;
if(stage===0){let q=words[idx[0]];
if(vocabPhase==='study'){
html+=`<h2>เรียนรู้คำเชื่อมก่อนฝึก</h2><p class="intro">อ่านคำศัพท์และความหมายให้เข้าใจ เมื่อพร้อมแล้วกดเริ่มฝึก ระบบจะซ่อนคำแปลทั้งหมด</p><div class="example"><span class="main">I stayed home</span> <span class="conj">because</span> <span class="dep">it rained.</span><div class="legend">🟢 Main clause · 🔴 Conjunction · 🔵 Dependent clause</div></div><div class="bank">${words.map(w=>`<div class="word"><b>${w[0]}</b><br>${w[1]}</div>`).join('')}</div><div class="footer"><span class="muted">เรียนรู้ 6 คำ</span><button class="primary" onclick="startRecall()">พร้อมแล้ว เริ่มฝึก →</button></div>`;
p.innerHTML=html;return;
}
let choiceOrder=order.map(i=>words[i][1]);let answer=order.indexOf(idx[0]);
html+=`<h2>ลองนึกความหมายด้วยตนเอง</h2><p class="intro">คลังคำศัพท์ถูกซ่อนแล้ว เลือกความหมายที่ตรงกับคำภาษาอังกฤษ</p><div class="question"><div class="muted">คำที่ ${idx[0]+1} / 6</div><h3>“${q[0]}” หมายถึงอะไร?</h3></div>${options(choiceOrder,answer)}<div class="support"><button class="secondary" onclick="toggleHint()">${vocabHint?'ซ่อนตัวช่วย':'ต้องการตัวช่วย?'}</button>${vocabHint?`<p class="muted">ลองนึกถึงการใช้คำนี้ในประโยคภาษาอังกฤษ และเปรียบเทียบความหมายของตัวเลือก หากยังไม่แน่ใจสามารถกลับไปทบทวนได้</p><button class="secondary" onclick="vocabPhase='study';render()">กลับไปทบทวนคลังคำศัพท์</button>`:''}</div>`;
}

else{let arr=stage===1?identify:stage===2?build:stage===3?comma:finalQuiz,q=arr[idx[stage]];let heads=['','หา Main Clause','รวมสองความคิด','Comma Detective','Final Challenge'];let instructions=['','เลือกส่วนที่เป็นประโยคหลัก ซึ่งอยู่เดี่ยว ๆ ได้','เลือกประโยคที่เชื่อมความคิดได้ถูกต้อง','สังเกตตำแหน่ง dependent clause แล้วเลือกการใช้ comma','เลือกประโยคที่ถูกต้องที่สุด ไม่ต้องพิมพ์คำตอบ'];html+=`<h2>${heads[stage]}</h2><p class="intro">${instructions[stage]}</p>`;if(stage===3)html+=`<div class="example"><span class="dep">Because it rained</span>, <span class="main">I stayed home.</span><br><span class="main">I stayed home</span> <span class="dep">because it rained.</span><div class="legend">ประโยคย่อยขึ้นหน้า → ใช้ comma · ประโยคหลักขึ้นหน้า → ปกติไม่ใช้ comma ในรูปแบบนี้</div></div>`;html+=`<div class="question"><div class="muted">ข้อ ${idx[stage]+1} / ${arr.length}</div><h3>${esc(q.s)}</h3></div>${options(q.o,q.a)}`}
let total=stage===0?6:(stage===1?identify:stage===2?build:stage===3?comma:finalQuiz).length;let q=stage===0?{a:order.indexOf(idx[0])}:(stage===1?identify:stage===2?build:stage===3?comma:finalQuiz)[idx[stage]];html+=`<div class="footer"><span class="muted">ข้อ ${idx[stage]+1} จาก ${total} · ลองตอบใหม่ได้</span><button class="primary" ${selected===q.a?'':'disabled'} onclick="advance()">${idx[stage]===total-1?(stage===4?'ดูผลการเรียน':'ไปขั้นถัดไป'):'ข้อต่อไป'} →</button></div>`;p.innerHTML=html}
render();
</script></body></html>
